<h2 mat-dialog-title>{{ data.title }}</h2>

<div mat-dialog-content>

  <p>{{ data.message }}</p>

</div>

<div mat-dialog-actions align="end">

  <button
    mat-stroked-button
    (click)="cancel()">

    Cancel

  </button>

  <button
    mat-flat-button
    color="warn"
    (click)="confirm()">

    Delete

  </button>

</div>
